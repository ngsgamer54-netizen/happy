<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merry Christmas Kirti 🎄</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background: url("https://images.unsplash.com/photo-1548778052-311f5fa7b5a3?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .card {
    width: 380px;
    background: rgba(15, 20, 45, 0.75);
    backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 35px 28px 30px;
    text-align: center;
    color: white;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6);
    position: relative;
  }

  .tree {
    width: 120px;
    margin-top: -80px;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
  }

  h1 {
    margin: 15px 0 6px;
    font-size: 30px;
    font-weight: 600;
    color: #ffd166;
  }

  .subtitle {
    font-size: 16px;
    opacity: 0.9;
    margin-bottom: 22px;
  }

  .btn {
    background: linear-gradient(135deg, #ff3d3d, #ff9f1c);
    border: none;
    border-radius: 35px;
    padding: 15px 28px;
    font-size: 17px;
    color: white;
    cursor: pointer;
    box-shadow: 0 15px 30px rgba(255,61,61,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn:hover {
    transform: scale(1.07);
    box-shadow: 0 20px 40px rgba(255,61,61,0.7);
  }

  .message {
    margin-top: 22px;
    font-size: 17px;
    line-height: 1.5;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .show {
    opacity: 1;
  }

  .santa {
    width: 130px;
    margin-top: 20px;
  }

  /* Snow */
  .snow {
    position: fixed;
    top: -10px;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: fall linear infinite;
  }

  @keyframes fall {
    to { transform: translateY(110vh); }
  }
</style>
</head>

<body>

<div class="card">
  <img class="tree"
    src="https://cdn-icons-png.flaticon.com/512/3076/3076126.png">

  <h1>🎄 Merry Christmas</h1>
  <div class="subtitle">Special wishes for <b>Kirti Sharma</b></div>

  <button class="btn" onclick="openGift()">Open Your Christmas Gift 🎁</button>

  <div id="msg" class="message">
    ❄️ Merry Christmas Kirti Sharma ❄️<br>
    May your life shine like Christmas lights,<br>
    your heart stay warm,<br>
    and your smile sparkle always ✨
  </div>

  <img class="santa"
    src="https://cdn-icons-png.flaticon.com/512/3076/3076129.png">
</div>

<audio id="music">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
</audio>

<script>
  function openGift() {
    document.getElementById("msg").classList.add("show");
    document.getElementById("music").play();
  }

  // Snow effect
  for (let i = 0; i < 45; i++) {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
    snow.style.opacity = Math.random();
    document.body.appendChild(snow);
  }
</script>

</body>
</html>
