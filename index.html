<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Merry Christmas Kirti 🎄</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1c2b4a, #0a0f1f);
    font-family: "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
  }

  /* Glass Card */
  .card {
    position: relative;
    width: 400px;
    padding: 40px 30px 35px;
    border-radius: 28px;
    background: rgba(20, 30, 60, 0.7);
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    text-align: center;
    z-index: 2;
  }

  /* Tree */
  .tree {
    width: 150px;
    margin-top: -110px;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
  }

  h1 {
    font-size: 34px;
    margin: 10px 0;
    color: #ffd36a;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 18px;
    margin-bottom: 22px;
    opacity: 0.95;
  }

  /* Button */
  .gift-btn {
    background: linear-gradient(135deg, #ff2d2d, #ff9f1a);
    border: none;
    border-radius: 40px;
    padding: 16px 34px;
    font-size: 18px;
    color: white;
    cursor: pointer;
    box-shadow: 0 18px 40px rgba(255,60,60,0.6);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .gift-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 25px 55px rgba(255,60,60,0.85);
  }

  /* Message */
  .message {
    margin-top: 26px;
    font-size: 18px;
    line-height: 1.6;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .show {
    opacity: 1;
  }

  .highlight {
    font-size: 22px;
    color: #aee6ff;
    text-shadow: 0 0 10px rgba(174,230,255,0.8);
    margin-bottom: 12px;
  }

  /* Santa */
  .santa {
    width: 150px;
    margin-top: 22px;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
  }

  /* Snow */
  .snow {
    position: fixed;
    top: -10px;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.85;
    animation: fall linear infinite;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh);
    }
  }
</style>
</head>

<body>

<div class="card">

  <!-- Tree -->
  <img class="tree"
    src="https://images.unsplash.com/photo-1608889175250-c3b0c1665b3c?auto=format&fit=crop&w=400&q=80"
    alt="Christmas Tree">

  <h1>🎄 Merry Christmas 🎅</h1>
  <div class="subtitle">Special wishes for <b>Kirti Sharma</b></div>

  <button class="gift-btn" onclick="openGift()">
    Open Your Christmas Gift 🎁
  </button>

  <div id="msg" class="message">
    <div class="highlight">❄️ Merry Christmas Kirti Sharma ❄️</div>
    May your life shine like Christmas lights,<br>
    your heart stay warm,<br>
    and your smile sparkle always ✨
  </div>

  <!-- Santa -->
  <img class="santa"
    src="https://cdn-icons-png.flaticon.com/512/3076/3076129.png"
    alt="Santa">

</div>

<!-- Music -->
<audio id="music">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<script>
  function openGift() {
    document.getElementById("msg").classList.add("show");
    document.getElementById("music").play();
  }

  // Snow generator
  for (let i = 0; i < 60; i++) {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = (Math.random() * 6 + 4) + "s";
    snow.style.opacity = Math.random();
    snow.style.transform = "scale(" + Math.random() + ")";
    document.body.appendChild(snow);
  }
</script>

</body>
</html>
