<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merry Christmas Kirti 🎄</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1b2a4e, #0b0f1f);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
    color: #fff;
    overflow: hidden;
  }

  .card {
    background: linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
    width: 360px;
    animation: float 4s ease-in-out infinite;
    z-index: 2;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .tree {
    width: 120px;
    margin-bottom: 15px;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.4));
  }

  h1 {
    font-size: 30px;
    margin: 8px 0;
  }

  h2 {
    font-size: 17px;
    font-weight: 400;
    opacity: 0.9;
    margin-bottom: 22px;
  }

  button {
    background: linear-gradient(135deg, #ff4d4d, #ffb703);
    border: none;
    border-radius: 30px;
    padding: 14px 30px;
    font-size: 16px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 10px 25px rgba(255,77,77,0.45);
  }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 15px 35px rgba(255,77,77,0.7);
  }

  .message {
    margin-top: 24px;
    font-size: 18px;
    line-height: 1.5;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .show { opacity: 1; }

  .snow {
    position: fixed;
    top: -10px;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: fall linear infinite;
  }

  @keyframes fall {
    to { transform: translateY(110vh); }
  }

  .footer-img {
    margin-top: 18px;
    width: 90px;
  }
</style>
</head>

<body>

<div class="card">
  <!-- Christmas Tree Image -->
  <img class="tree"
    src="https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&w=300&q=80"
    alt="Christmas Tree">

  <h1>🎄 Merry Christmas 🎅</h1>
  <h2>Special wishes for Kirti Sharma</h2>

  <button onclick="wish()">Open Your Christmas Gift 🎁</button>

  <div id="msg" class="message">
    ❄️ Merry Christmas <b>Kirti Sharma</b> ❄️<br>
    May your life shine like Christmas lights,<br>
    your heart stay warm,<br>
    and your smile sparkle always ✨💖
  </div>

  <!-- Santa Image -->
  <img class="footer-img"
    src="https://cdn-icons-png.flaticon.com/512/3076/3076129.png"
    alt="Santa">
</div>

<!-- Christmas Music -->
<audio id="music">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<script>
  function wish() {
    document.getElementById("msg").classList.add("show");
    document.getElementById("music").play();
  }

  // Snow effect
  for (let i = 0; i < 45; i++) {
    let snow = document.createElement("div");
    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
    snow.style.opacity = Math.random();
    snow.style.transform = "scale(" + Math.random() + ")";
    document.body.appendChild(snow);
  }
</script>

</body>
</html>
